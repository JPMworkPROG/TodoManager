version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todomanager-app
    ports:
      - "${SERVER_PORT:-3000}:3000"
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - SERVER_PORT=3000
      - DATABASE_URL=file:/app/backend/prisma/db/todomanager.db
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api}
      - NEXT_PUBLIC_PAGE_SIZE=${NEXT_PUBLIC_PAGE_SIZE:-2}
    restart: unless-stopped
